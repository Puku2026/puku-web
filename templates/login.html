{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card card-dark p-4 shadow-lg">
            <h3 class="text-center text-accent mb-4">Acceso al Sistema</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-light">Usuario:</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" placeholder="Ej: yamil" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-light">Contraseña:</label>
                    <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-puku w-100 py-2 mt-2">Ingresar al POS</button>
            </form>
            <div class="mt-3 text-center text-muted fs-7">
                <small>ADAHARA S.R.L. & Pollos PuKú</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
