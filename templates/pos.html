{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- PANEL IZQUIERDO: PESTAÑAS Y PRODUCTOS -->
    <div class="col-md-8">
        <div class="card card-dark p-3 mb-3">
            <!-- Pestañas del Menú -->
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link active bg-warning text-dark font-weight-bold me-1" id="tab-broaste" data-bs-toggle="pill" data-bs-target="#broaste">Broaste</button></li>
                <li class="nav-item"><button class="nav-link bg-secondary text-light font-weight-bold me-1" id="tab-brasa" data-bs-toggle="pill" data-bs-target="#brasa">🍗 A la Brasa</button></li>
                <li class="nav-item"><button class="nav-link bg-secondary text-light font-weight-bold me-1" id="tab-especiales" data-bs-toggle="pill" data-bs-target="#especiales">Especiales</button></li>
                <li class="nav-item"><button class="nav-link bg-secondary text-light font-weight-bold me-1" id="tab-sodas" data-bs-toggle="pill" data-bs-target="#sodas">🥤 Sodas</button></li>
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <!-- Broaste -->
                <div class="tab-pane fade show active" id="broaste">
                    <div class="row g-2">
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Eco Pierna', 15)" class="btn btn-warning w-100 py-3 fw-bold">Eco Pierna<br>15 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Eco Contra', 15)" class="btn btn-warning w-100 py-3 fw-bold">Eco Contra<br>15 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Eco Pecho', 16)" class="btn btn-warning w-100 py-3 fw-bold">Eco Pecho<br>16 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Eco Ala', 16)" class="btn btn-warning w-100 py-3 fw-bold">Eco Ala<br>16 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('¼ Pecho Broaste', 30)" class="btn btn-warning w-100 py-3 fw-bold">¼ Pecho<br>30 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('¼ Pierna Broaste', 30)" class="btn btn-warning w-100 py-3 fw-bold">¼ Pierna<br>30 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('½ Pollo Broaste', 55)" class="btn btn-warning w-100 py-3 fw-bold">½ Pollo<br>55 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('1 Pollo Broaste', 110)" class="btn btn-warning w-100 py-3 fw-bold">1 Pollo<br>110 Bs</button></div>
                    </div>
                </div>
                <!-- A la Brasa -->
                <div class="tab-pane fade" id="brasa">
                    <div class="row g-2">
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('¼ Pecho Brasa', 30)" class="btn btn-danger w-100 py-3 fw-bold text-white">¼ Pecho Brasa<br>30 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('¼ Pierna Brasa', 30)" class="btn btn-danger w-100 py-3 fw-bold text-white">¼ Pierna Brasa<br>30 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('½ Pollo Brasa', 55)" class="btn btn-danger w-100 py-3 fw-bold text-white">½ Pollo Brasa<br>55 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('1 Pollo Brasa', 110)" class="btn btn-danger w-100 py-3 fw-bold text-white">1 Pollo Brasa<br>110 Bs</button></div>
                    </div>
                </div>
                <!-- Especiales -->
                <div class="tab-pane fade" id="especiales">
                    <div class="row g-2">
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Hamburguesa Simple', 15)" class="btn btn-info w-100 py-3 fw-bold text-dark">Hamburguesa<br>15 Bs</button></div>
                        <div class="col-6 col-md-3"><button onclick="agregarAlCarrito('Salchipapas', 12)" class="btn btn-info w-100 py-3 fw-bold text-dark">Salchipapas<br>12 Bs</button></div>
                    </div>
                </div>
                <!-- Sodas -->
                <div class="tab-pane fade" id="sodas">
                    <div class="row g-2">
                        <div class="col-6 col-md-4"><button onclick="abrirSelectorSoda('Pekes', 3.0)" class="btn btn-success w-100 py-4 fw-bold">🥤 Pekes<br>3.00 Bs</button></div>
                        <div class="col-6 col-md-4"><button onclick="abrirSelectorSoda('Personales', 7.0)" class="btn btn-primary w-100 py-4 fw-bold">🥤 Personales<br>7.00 Bs</button></div>
                        <div class="col-6 col-md-4"><button onclick="abrirSelectorSoda('2 Litros', 15.0)" class="btn btn-purple w-100 py-4 fw-bold text-white" style="background-color: #7209b7;">🥤 2 Litros<br>15.00 Bs</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- PANEL DERECHO: CARRITO Y COBRO -->
    <div class="col-md-4">
        <div class="card card-dark p-3 mb-3">
            <h5 class="text-accent">Pedido Actual</h5>
            <div class="mb-2">
                <label class="form-label text-light fs-7 mb-1">Cliente / Ref:</label>
                <input type="text" id="cliente" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Ej: Torres">
            </div>
            <div class="row mb-2">
                <div class="col-6">
                    <label class="form-label text-light fs-7 mb-1">Tipo Pedido:</label>
                    <select id="tipo_pedido" class="form-select form-select-sm bg-dark text-light border-secondary">
                        <option value="Para Llevar">Para Llevar</option>
                        <option value="Mesa">Mesa</option>
                        <option value="Delivery">Delivery</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label text-light fs-7 mb-1">Pago:</label>
                    <select id="metodo_pago" class="form-select form-select-sm bg-dark text-light border-secondary">
                        <option value="Efectivo">Efectivo</option>
                        <option value="QR">QR</option>
                        <option value="PeYa">PeYa</option>
                    </select>
                </div>
            </div>
            <!-- Tabla Carrito Dinámico -->
            <div class="border border-secondary p-2 rounded mb-3 bg-dark" style="min-height: 180px; max-height: 250px; overflow-y: auto;">
                <table class="table table-dark table-sm fs-7 mb-0">
                    <thead>
                        <tr>
                            <th>Prod</th>
                            <th class="text-center">Cant</th>
                            <th class="text-end">Subt</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-carrito">
                        <!-- Se llena con JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <button onclick="vaciarCarrito()" class="btn btn-outline-danger btn-sm">Limpiar</button>
                <h4 id="total-txt" class="text-warning m-0">Total: 0.00 Bs</h4>
            </div>
            <button onclick="cobrarPedido()" class="btn btn-success w-100 font-weight-bold py-2 mt-3 fs-5">✓ Confirmar y Cobrar</button>
        </div>
        <!-- CONTROL DE STOCK -->
        <div class="card card-dark p-3">
            <h6 class="text-info mb-2">📦 Stock Cocina y Bebidas</h6>
            <div class="d-flex justify-content-between align-items-center fs-7 mb-1">
                <span>Pecho: <strong id="st-Pecho">{{ stock['Pecho'] }}</strong></span>
                <div>
                    <button onclick="modificarStock('Pecho', -1)" class="btn btn-danger btn-sm py-0 px-2">-</button>
                    <button onclick="modificarStock('Pecho', 1)" class="btn btn-success btn-sm py-0 px-2">+</button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center fs-7 mb-1">
                <span>Pierna: <strong id="st-Pierna">{{ stock['Pierna'] }}</strong></span>
                <div>
                    <button onclick="modificarStock('Pierna', -1)" class="btn btn-danger btn-sm py-0 px-2">-</button>
                    <button onclick="modificarStock('Pierna', 1)" class="btn btn-success btn-sm py-0 px-2">+</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA SELECCIONAR SABOR DE SODA -->
<div class="modal fade" id="modalSaborSoda" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title text-info" id="tituloModalSabor">Seleccionar Sabor</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2" id="listaSaboresGrid">
          <!-- Botones de sabores generados por JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let carrito = [];
const saboresDisponibles = [
    "Coca Cola", "Coca Cola Zero", "Sprite", "Fanta Naranja", 
    "Fanta Mandarina", "Fanta Guaraná", "Fanta Papaya", "Fanta Uva", 
    "Acuarius Pera", "Acuarius Pomelo", "Oro", "Inka Kola", 
    "Del Valle Manzana", "Del Valle Guayaba", "Del Valle Naranja"
];

function agregarAlCarrito(nombre, precio, categoriaSoda = null, saborSoda = null) {
    let nombreMostrar = saborSoda ? `${nombre} (${saborSoda})` : nombre;
    let item = carrito.find(i => i.nombre === nombreMostrar);
    if (item) {
        item.cant++;
        item.subtotal = item.cant * precio;
    } else {
        carrito.push({ 
            nombre: nombreMostrar, 
            nombre_base: nombre,
            precio: precio, 
            cant: 1, 
            subtotal: precio,
            categoria_soda: categoriaSoda,
            sabor_soda: saborSoda
        });
    }
    renderizarCarrito();
}

function abrirSelectorSoda(categoria, precio) {
    document.getElementById("tituloModalSabor").innerText = `Seleccionar Sabor - ${categoria} (${precio} Bs)`;
    let grid = document.getElementById("listaSaboresGrid");
    grid.innerHTML = "";
    
    saboresDisponibles.forEach(sabor => {
        grid.innerHTML += `
            <div class="col-6">
                <button onclick="elegirSaborSoda('${categoria}', '${sabor}', ${precio})" class="btn btn-outline-light w-100 py-2 text-start mb-1 text-truncate">
                    ${sabor}
                </button>
            </div>
        `;
    });
    
    let modal = new bootstrap.Modal(document.getElementById('modalSaborSoda'));
    modal.show();
}

function elegirSaborSoda(categoria, sabor, precio) {
    let nombreBase = `Soda ${categoria}`;
    agregarAlCarrito(nombreBase, precio, categoria, sabor);
    let modalEl = document.getElementById('modalSaborSoda');
    let modal = bootstrap.Modal.getInstance(modalEl);
    modal.hide();
}

function renderizarCarrito() {
    let tbody = document.getElementById("tabla-carrito");
    tbody.innerHTML = "";
    let total = 0;
    carrito.forEach((item, index) => {
        total += item.subtotal;
        tbody.innerHTML += `
            <tr>
                <td>${item.nombre}</td>
                <td class="text-center">${item.cant}</td>
                <td class="text-end">${item.subtotal.toFixed(2)} Bs</td>
                <td class="text-end"><button onclick="eliminarItem(${index})" class="btn btn-link text-danger p-0">✕</button></td>
            </tr>
        `;
    });
    document.getElementById("total-txt").innerText = `Total: ${total.toFixed(2)} Bs`;
}

function eliminarItem(index) {
    carrito.splice(index, 1);
    renderizarCarrito();
}

function vaciarCarrito() {
    carrito = [];
    renderizarCarrito();
}

function cobrarPedido() {
    if (carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
    }
    let total = carrito.reduce((sum, item) => sum + item.subtotal, 0);
    let payload = {
        cliente: document.getElementById("cliente").value || "Sin Nombre",
        tipo_pedido: document.getElementById("tipo_pedido").value,
        metodo_pago: document.getElementById("metodo_pago").value,
        items: carrito,
        total: total
    };
    fetch("/api/cobrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        vaciarCarrito();
        document.getElementById("cliente").value = "";
    });
}

function modificarStock(item, delta) {
    fetch("/api/stock/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: item, delta: delta })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            let el = document.getElementById("st-" + item);
            if (el) el.innerText = data.nueva_cantidad;
        } else {
            alert(data.message);
        }
    });
}
</script>
{% endblock %}
